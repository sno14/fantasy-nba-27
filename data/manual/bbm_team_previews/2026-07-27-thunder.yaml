budget_note: >
  BBM STATES NO MINUTES OR USAGE FIGURE FOR ANY PLAYER. This is a scene-setting episode — franchise
  outlook, the tax-driven purge ($240M bill cut to $20M), the four rookie-deal lottery picks, a chapter on
  Chet's psychology, a win total — and Josh says the per-player fantasy pass with ADP and projections comes
  in September. So bbm_mpg is blank throughout and his minutes/usage priority weight never engages.
  .
  What he DOES state is a depth chart, and under the 2026-07-27 amendment that is enough. The vacancy is
  large and real: Dort (26.8 mpg), Isaiah Joe (21.2), Aaron Wiggins (21.8) and Branden Carlson (11.6) all
  left for no returning salary — 64.1 mpg and 23.0% of OKC's 2025-26 possessions, replaced by rookies and
  two-ways.
  .
  THE FINDING THAT FORCED THE AMENDMENT: the model appears to have absorbed +27.6 mpg of that vacancy
  (293.6 model ex-Dort vs 266.1 actual for the same 13), which is why the first pass read it as priced.
  It is not. +19.7 of the +27.6 goes to Buddy Boeheim (+11.65, rank 565, off a FOUR-game sample) and
  Brooks Barnhizer (+8.00, rank 361) — two players the preview never mentions. The rank<=300 rotation
  absorbed +10.0 of 64.1. Absorption concentrated outside the rotation is not absorption, and
  `already_priced` computed on team totals hides exactly this.
  .
  The allocation therefore does what the model cannot: ~54 mpg has to come out of the 293.6, and BBM's
  depth chart says where. Modest positives on the named rotation (Hartenstein +1.77, Wallace +1.50,
  Mitchell +1.98 incl. a rate leg), one negative on a player BBM likes (Caruso -2.73, whose point is role
  importance not volume), and the large cuts on the tail the model over-minutes (Barnhizer, Topic, Kenrich,
  Boeheim — all rank 361+, immaterial to a 10-team board but the counterparties that make the budget real).
  Jaylin Williams -5.24 is the most arguable and is deliberately short of a purge.
  .
  CONVICTION: every budget_mpg here is OUR arithmetic, not BBM's testimony, and carries less weight than a
  quoted figure would. September's OKC fantasy preview is the resolver and this ledger is the
  pre-registered scorecard for it.
