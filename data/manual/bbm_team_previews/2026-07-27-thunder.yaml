# Schema + contract: ./README.md. Full sizing rules: ../bbm_transcripts/README.md (Team-preview mode).
#
# *** THIS PREVIEW STATES NO MINUTES AND NO USAGE NUMBERS FOR ANY PLAYER. ***
# Every bbm_mpg cell is therefore BLANK and stays blank — he gave no figure, and testimony is never
# back-filled with our own arithmetic. What he DID state is a depth chart: a named starting five, a
# ~10-man regular-season rotation ("shrink to nine or eight" for the playoffs), four named departures,
# and a read on which reserves are not ready. Under the 2026-07-27 amendment that is enough to allocate
# the closed 240-minute budget ourselves -> the budget_mpg column, which sums to exactly 240 across ALL
# rows including rookies. budget_mpg carries LESS conviction than a quoted figure and is the first thing
# the mid-Oct re-review should re-open.
