# BOS minutes+usage ledger — BBM team-preview snapshot (John Karalis, Locked On Celtics).
# DATED SNAPSHOT as of preview_date: model_* columns are the learned_2026-27 base then; not live.
# Schema + contract: ./README.md. Full sizing rules: ../bbm_transcripts/README.md (Team-preview mode).
#
# *** ONE STATED MINUTES FIGURE IN THE WHOLE EPISODE — the center split. *** Josh: "is that a okay
# here is 24 minutes a piece?"; Karalis: "it's going to be basically mid 20 minutes for one guy, mid 20
# minutes for the other guy... they'll probably close with Queta." That is testimony and it is the ONLY
# thing in the bbm_mpg column (Robinson 24, Queta 24 = the 48 center minutes, exactly). No usage figure
# is stated forward; the one usage number given is RETROSPECTIVE (Pritchard "a 21 usage in 32 minutes as
# a starter") and it verifies our cache to a decimal (computed 21.4 USG% at 32.3 mpg) — a good check on
# the model_usg column rather than a claim about 2026-27.
#
# Everything else is budget_mpg = OUR arithmetic under the 2026-07-27 amendment, because the preview DOES
# state a depth chart: a named starting five (White / Tatum / George / Hauser / Robinson), a named bench
# order (Pritchard the six-man ball-handler, Scheierman and Gonzalez the secondary handlers, Conley
# explicitly NOT trusted with the ball, Garza "still going to be your third string center"), named
# departures/arrivals (Brown out; George, Robinson, Conley, Cenac in), and a reserves-ready read ("all of
# those guys come into this season with a little bit more definition to their games and roles").
# budget_mpg carries LESS conviction than a quoted figure and is the first thing the mid-Oct pass reopens.
#
# THE VACANCY, AND WHY THE TAIL TAKES THE CUT. Jaylen Brown (~34 mpg, primary-option usage) leaves, and
# Tatum (16 gp last season) plus Paul George arrive into the SAME 240. That is ~+28 mpg of star minutes
# entering a closed system, so ~28 mpg must come out of the bench — and the model is moving the bench the
# WRONG WAY, projecting Scheierman 18.6 -> 21.7, Gonzalez 14.6 -> 18.1 and Walsh 17.8 -> 18.9 because it
# watched them absorb a Tatum-less season and reads that as growth. The 12 rotation rows sum to 280.6
# model mpg against a 240 budget. That 40-mpg overhang is the depth-chart redistribution the model cannot
# derive from box scores, and it is where every negative below comes from.
team: BOS
team_full: Boston Celtics
preview_date: 2026-07-31
source_file: 2026-07-31-celtics-season-preview.md
win_proj: 48            # DOWN from last season but explicitly environmental, not a talent call:
                        # "I think they are better at the start of this year than they were at the start
                        # of last year"; the cut is a deeper East + "we're not going to have eight teams
                        # punting 17 consecutive games in April and March".
availability_note: >
  NO team-level rest/tanking signal — Boston is trying to win and nothing in the episode suggests
  otherwise. What there IS, and it is substantial, is PLAYER-level availability, all of it
  config/overrides.yaml material for Steven and NONE of it analyst-layer material:
  (1) PAUL GEORGE — "I know for maybe half the season, Paul George won't play" plus "Paul George isn't
  going to play back to backs". This is the one item with a quasi-number: "half the season" is ~41 games
  against the model's gp base of 53. Genuinely actionable if Steven wants it.
  (2) MITCHELL ROBINSON — "Robinson's always a question", "he's got a lot of ankle problems, he's going
  to miss games", "not going to play back to backs". Model gp base is already a low 41, so the +5 mpg
  entry below is a per-game-played claim that does NOT assume he plays more games.
  (3) JAYSON TATUM — the only POSITIVE availability signal, and it is a real one: "I have zero worries";
  the game-7 absence was knee inflammation from overloading the good leg, "nothing that required any sort
  of surgery... nothing that seems to be any kind of chronic"; and the mechanism is a first real offseason
  since the Achilles ("he never had the off season... now you get June July August September"). gp is not
  ours, which is exactly why his row below is `none` — see the note there.
budget_min: 240
rows:
  # ---- projected starting five (Karalis: White / Tatum / George / Hauser / Robinson, with his own
  #      hedge that "if I'm being honest, I do think that Queta will probably start") ----
  - player: Jayson Tatum
    model_mpg: 34.5
    bbm_mpg: ""                       # none stated
    budget_mpg: 34.0
    model_usg: 30.0                   # 16-gp post-Achilles sample; 2024-25 healthy was 31.2
    bbm_usg: ""                       # none stated
    verdict: "none"
    proposal: false
    note: >
      THE TEXTBOOK CONVERSE-RULE ROW, and the contract README names him for it. A full chapter of
      unambiguous health optimism that prices to ZERO here, because every word of it is about GAMES
      PLAYED, which this layer does not own. On the two things it does own the model is already right:
      rate_held = 1.3069 (16 gp) / 1.3271 (2024-25 healthy) = 0.985, just under 1.0, so per EXP-033 the
      model's mild rate fade is correct and re-anchoring on the healthy season is the exact error that
      backtested to +3.34 fpts/g. And the model fades him 36.4 -> 34.5 mpg, which is the fade living in
      MINUTES where EXP-033 says it should. Budget 34.0 vs 34.5 is -0.5, inside the 1.5 floor. Back-
      solving a target_mpg out of the health optimism would imply a minutes RISE for a 28-year-old one
      year off an Achilles — the precise inversion the README uses him to illustrate.
  - player: Derrick White
    model_mpg: 31.7
    bbm_mpg: ""                       # none stated in either direction
    budget_mpg: 32.0
    model_usg: 22.0                   # a real jump: 18.6 -> 19.8 -> 22.0 as he absorbed the Tatum-less year
    bbm_usg: "'his usage ramped up and he had to do a different role'; expects it to come back down next to Tatum + George"
    verdict: "+2.0"
    proposal: true
    note: >
      The one RATE entry in the batch and the only one that matters to a 10-team board (rank 51). Karalis's
      pick for the player who sets the team's ceiling, and the mechanism is specific and mechanically
      reversible: 3PT .327 last season against .384 and .396 the two years before, on 8.31 attempts. Sized
      as a shooting recovery at UNCHANGED minutes — a bare fpts_delta, which the contract says is the RIGHT
      verb for an efficiency belief, not a fallback. The budget independently agrees to leave minutes alone
      (32.0 vs 31.7 = +0.3). Note the model has priced NONE of the rebound: its fpm 1.0552 sits BELOW his
      last actual 1.0914, i.e. already_priced is -1.15, an aging fade nothing in the episode contradicts
      and which this entry does not try to undo.
  - player: Paul George
    model_mpg: 28.8
    bbm_mpg: ""                       # none stated
    budget_mpg: 28.0
    model_usg: 23.3                   # 37-gp season; 26.6 in his last healthy year (2023-24)
    bbm_usg: ""                       # none stated
    verdict: "none"
    proposal: false
    note: >
      Everything said about him is availability (see availability_note) or trade speculation ("he probably
      won't be here for long"). On value: rate_held = 1.1489 / 1.2075 (2023-24 healthy) = 0.951, below 1.0,
      so the rate genuinely fell and EXP-033 forbids re-anchoring. The model's fpm 1.0066 is an aggressive
      fade even against that, but there is no named mechanism to push back with — a 36-year-old on his
      third team in three years is not one. Budget 28.0 vs 28.8 = -0.8, inside the floor.
  - player: Sam Hauser
    model_mpg: 22.7
    bbm_mpg: ""                       # none stated
    budget_mpg: 23.0
    model_usg: 14.5
    bbm_usg: "explicitly low by design — 'he's not going to try to do too much in a starting lineup'"
    verdict: "none"
    proposal: false
    note: >
      Promoted to STARTER in Karalis's five, and it prices to nothing — the useful reminder that a
      starting job is not a minutes claim. He already played 24.8 mpg with heavy starts last season; the
      model's 22.7 is a mild fade off that, and the budget lands at 23.0 (+0.3, inside the floor). His
      role is defined by the guest as deliberately minimal ("a happy catch and shoot guy"), so there is no
      usage or rate leg either. He is named as one of the "four shooters" around Robinson in the dunker
      spot, which supports minutes STABILITY — context, not a delta.
  - player: Mitchell Robinson
    model_mpg: 19.0
    bbm_mpg: "~24 ('mid 20 minutes'; Josh's '24 minutes a piece' not contradicted)"
    budget_mpg: 24.0
    model_usg: 10.7
    bbm_usg: ""                       # none stated; a pure vertical-spacing/OReb role
    verdict: "+5.04"
    proposal: true
    note: >
      THE STATED-MINUTES ROW. +5.0 mpg against the model is the largest gap in the ledger and clears the
      ~2 mpg presumptive-action threshold twice over, on testimony rather than our arithmetic. The model
      is pricing a New York backup who played 19.6 mpg behind Karl-Anthony Towns; Boston signed him
      3yr/$47.4M to start. Rate held flat at 1.0089 — the episode's rate content is either already in the
      base ("Robinson can't even hit a free throw", .408 FT) or is a minutes argument wearing rate
      clothing (the no-team-fouls case for starting him). Availability is deliberately NOT touched: the
      model's 41 gp base already prices the ankle history.
  # ---- the bench, in the order the preview states it ----
  - player: Payton Pritchard
    model_mpg: 28.1
    bbm_mpg: ""                       # none stated forward
    budget_mpg: 27.0
    model_usg: 21.4                   # BBM's "21 usage" — verified to a decimal
    bbm_usg: "down: 'the whole usage calculation is actually more crowded because you've got Tatum and George versus Brown'"
    verdict: "none"
    proposal: false
    note: >
      A whole chapter demolishing the "Pritchard is the next Brunson" story — "there's fewer opportunities
      and he's probably going to play fewer minutes", "I would expect somewhat of a ramp backwards", "he
      kind of is who he is... I think he has basically peaked" — and the correct verdict is `none`,
      because the MODEL ALREADY AGREES: it fades him 32.3 -> 28.1 mpg, and 28.1 is almost exactly the 28.4
      he played as a six-man in 2024-25, the last season with a full-strength roster in front of him. This
      is the assurance case in the rubric: directional agreement with NO magnitude gap. Budget 27.0 is
      -1.1, inside the 1.5 floor. Writing a delta here would double-count a fade the model has already
      taken — and it is worth noticing that the loudest negative narrative in the episode is the one that
      needs no entry.
  - player: Neemias Queta
    model_mpg: 22.8
    bbm_mpg: "~24 ('mid 20 minutes' — the other half of the split; 'they'll probably close with Queta')"
    budget_mpg: 24.0
    model_usg: 14.7
    bbm_usg: ""                       # none stated
    verdict: "none"
    proposal: false
    note: >
      The other half of the stated center split, and the check working in the negative direction: +1.2 mpg
      is inside BOTH the 1.5 materiality floor and the ~2 mpg priority threshold, so BBM's testimony here
      CONFIRMS the model rather than moving it. Only Robinson was mispriced. The mid-range-jumper /
      floater development is raised and then explicitly hedged to nothing by the guest himself ("not
      nothing you can rely on"), so no rate leg. Just extended for this season and four more, so the
      bench/start question carries no contract friction either way.
  - player: Baylor Scheierman
    model_mpg: 21.7
    bbm_mpg: ""                       # none stated
    budget_mpg: 15.0
    model_usg: 11.9
    bbm_usg: ""                       # none stated
    verdict: "-4.83"
    proposal: true
    note: >
      First of the four bench cuts. The model projects him UP from 18.6 to 21.7 mpg; the preview has him
      as a bench secondary ball-handler behind Pritchard on a team that just re-added Tatum and George.
      His 2025-26 minutes came substantially from starting "big chunks of those games" during the Tatum
      absence — an opening that no longer exists. Budget-derived, not stated.
  - player: Hugo Gonzalez
    model_mpg: 18.1
    bbm_mpg: ""                       # none stated
    budget_mpg: 10.0
    model_usg: 11.8
    bbm_usg: ""                       # none stated
    verdict: "-6.35"
    proposal: true
    note: >
      Same shape as Scheierman and slightly worse: the model projects 14.6 -> 18.1 mpg off a season whose
      minutes existed because Tatum did not play. Named third in the bench ball-handler order ("Scheierman
      secondary ball handler OR Gonzalez secondary ball handler") and grouped in the speculative "if two of
      those guys can have double digit seasons" line — hope, not a role. Budget-derived, not stated.
  - player: Mike Conley
    model_mpg: 18.9
    bbm_mpg: ""                       # none stated
    budget_mpg: 9.0
    model_usg: 11.5
    bbm_usg: ""                       # none stated
    verdict: "-8.35"
    proposal: true
    note: >
      The clearest model miss on the roster. He is 39 and the model applies essentially NO aging fade
      (18.4 actual -> 18.9 projected) while also projecting his per-minute rate UP (0.7667 -> 0.8434) after
      two straight declining seasons. And the preview's one substantive remark about him is a demotion:
      the entire reason Pritchard must come off the bench is "those are your two ball handlers and I'm not
      going to put too much on Mike Conley" — he is emergency insurance, not the backup point guard.
      Budget-derived, not stated.
  - player: Jordan Walsh
    model_mpg: 18.9
    bbm_mpg: ""                       # none stated
    budget_mpg: 8.0
    model_usg: 11.7
    bbm_usg: ""                       # none stated
    verdict: "-9.11"
    proposal: true
    note: >
      Given the faintest praise of the three young wings ("took at least a DECENT step forward", against
      Scheierman's "big step forward"), is not in the starting five, and is not named anywhere in the bench
      ball-handler order — he appears only inside the same speculative "double digit seasons" clause. The
      model has him at 18.9 mpg, essentially tied with Conley and above Robinson. Budget-derived, not stated.
  - player: Luka Garza
    model_mpg: 15.4
    bbm_mpg: ""                       # none stated
    budget_mpg: 5.0
    model_usg: 17.7
    bbm_usg: ""                       # none stated
    verdict: "-10.67"
    proposal: true
    note: >
      The largest cut, and the most mechanical one in the ledger: "Luka Garza is still going to be your
      third string center", behind a stated Robinson/Queta split that consumes all 48 center minutes. His
      16.2 mpg last season is fully explained by Boston fielding what the episode calls "on paper maybe
      one of the worst center rotations in the NBA" before signing Robinson — the model carried that
      forward at 15.4 as though nothing happened. Small residual role survives via Mazzulla's matchup
      five-out looks. Budget-derived, not stated.
  # ---- rookie ----
  - player: Chris Cenac Jr.
    model_mpg: null                   # not on the learned board
    bbm_mpg: ""
    budget_mpg: 1.0
    model_usg: null
    bbm_usg: ""
    verdict: "defer(rookie)"
    proposal: false
    note: >
      2026 first-round pick (#27), signed 07-05. The preview names him only in the arrivals list and hands
