    model_usg: 30.4
    bbm_usg: ""                       # none stated
    verdict: "none"
    proposal: false
    note: >
      The chapter on him is a contract/trade hypothetical, not a projection ("Nikola Jokic can be a free
      agent in the upcoming season"; the guest answers "Yes" to whether they would trade him and then
      concludes "I think Nikola Jokic is on the roster the entire year. I think he re-signs"). The only
      minutes content is retrospective and agrees with us: Josh recalls him "playing like 36 minutes a
      night the season before" and notes "at least they did bring those numbers down" — he played 34.8 and
      the model projects 34.6. Rate: model fpm 1.7584 against last season's 1.9030, a substantial fade on
      the best per-minute player in the league; nothing in the episode speaks to it either way.
  - player: Jamal Murray
    model_mpg: 34.1
    bbm_mpg: ""                       # none stated
    budget_mpg: null
    model_usg: 27.9
    bbm_usg: ""                       # none stated
    verdict: "none"
    proposal: false
    note: >
      Named as a deadline trade candidate on defensive-fit grounds ("I don't think you can build a top 15
      defense with Jokic above 30 and Jamal Murray above 30. And if that's the case, then you got to trade
      Jamal Murray"), which is a roster hypothetical, not a role claim. The basketball read is positive but
      unnumbered: "I'm probably the most positive person in Denver right now on Jamal about where his game
      has evolved to. He's much more of a playmaker." Model already fades 35.4 -> 34.1 mpg and 1.3191 ->
