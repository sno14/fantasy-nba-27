# DEN minutes+usage ledger — BBM team-preview snapshot (Matt Moore, Locked On Nuggets).
# DATED SNAPSHOT as of preview_date: model_* columns are the learned_2026-27 base then; not live.
# Schema + contract: ./README.md. Full sizing rules: ../bbm_transcripts/README.md (Team-preview mode).
#
# *** NO 240 ALLOCATION — this preview fails step 1 of the 2026-07-27 amendment more clearly than DAL. ***
# The amendment allows the closed 240 to supply a minutes number only when a preview states a depth chart.
# Here the ROSTER ITSELF is unresolved, in the starting five:
#   * PEYTON WATSON IS AN UNSIGNED RESTRICTED FREE AGENT and appears in the projected starting five. The
#     entire opening chapter is a negotiation forecast — "clutch is likely asking for between 25 and 30
#     million. The Nuggets have offered between 15 and 20 and they'll eventually settle between 20 and 25"
#     — with resolution expected "the first week in September".
#   * CAM JOHNSON (29.6 model mpg) IS EXPECTED TO BE TRADED: "our expectation at Locked On Nuggets is that
#     they are going to re-sign Peyton Watson and then trade Cam Johnson to get under the second apron."
#   * AND MORE AFTER THAT: "I think that there will be at least two starters from last year's team,
#     including Cam Johnson, that will be gone by the deadline" — Jamal Murray and Aaron Gordon both named
#     as candidates.
#   * The guest opens with "I wish I could tell you more about what the Nuggets are going to be than I can
#     right now", and Josh closes with "this is all table setting stuff. This is an amuse bouche", with the
#     DEN fantasy preview promised for September.
# No rotation size is given, no bench order, and no minutes figure for anyone except Julian Strawther.
# Allocating 240 across a starting five containing an unsigned player would be arithmetic pretending to be
# a belief. bbm_mpg carries the ONE stated figure; budget_mpg stays null throughout.
#
# BUT ONE ENTRY DOES COME OUT OF IT, AND THE BUDGET IS NOT NEEDED FOR IT. A quoted minutes figure stands
# on its own — that is the `target_mpg` verb's whole purpose, and it is why the Mitchell Robinson entry in
# Batch 12 did not need a budget either. Strawther is the only player here BBM numbers, and the number
# happens to sit BELOW our model, which is the opposite of what the "he has to play more" framing implies.
team: DEN
team_full: Denver Nuggets
preview_date: 2026-07-31
source_file: 2026-07-31-nuggets-season-preview.md
win_proj: 50            # and explicitly a DOWNGRADE on talent: "there's zero chance of the roster on paper
                        # being better than last year", driven by the Hardaway/Brown losses plus the
                        # second-apron squeeze. "I think with Jokic you get 50 wins, he's that good."
availability_note: >
  No team-level tanking signal, but a strong and unusually specific REST signal that is
  config/overrides.yaml material for Steven, not analyst-layer material:
  (1) AARON GORDON — "recurrent calf, hamstring, soft tissue, lower body, old man injuries"; 36 gp last
  season against a model gp base of 51. Josh floats "you're playing 27 minutes a night" as a minutes cap;
  the guest does NOT take the number and instead argues for PROACTIVE SCHEDULE management: "you go into the
  season and you look at the schedule and you go, this is a five in seven, you're not playing three of
  these games... These are the dates that you're absolutely not playing." That is a games-played claim, so
  it is routed to Steven and is deliberately NOT priced as a minutes delta below.
  (2) The same argument is extended to Jamal Murray and to Jokic ("who gets more gassed than he's willing
  to admit defensively in the middle of the season"), with the guest's own caveat that he does not trust
  the team to actually do it: "I just don't have a lot of confidence that they're going to."
  (3) Team-level injury-management concern worth recording: "we have a lot of concerns about the Nuggets
  training staff given some of the injury history here over my time here."
budget_min: 240
rows:
