    proposal: false
    note: >
      The most tempting `none` in this ledger, and it holds. There IS a named, mechanically-real bounce-back
      component — "to get back to 25 is just about finishing... he was literally one of the best finishers
      in the league in 25, him and Giannis for the most transition points, and he fell off a cliff", caused
      by an ankle in which "I tore several ligaments" — and the guest predicts it: "I think Christian Braun
      does have a bounceback year." But the model has ALREADY taken it: fpm 0.8597 against last season's
      0.7826 is +2.3 fpts/g of recovery at his projected minutes, off a 44-gp base. And the improvement the
      guest actually demands is defensive — "he has to be 1.5 to two times the defender that he was last
      year" — which in a points league buys almost nothing unless it shows up as steals or blocks, and no
      such claim is made. Directional agreement with no unpriced remainder.
