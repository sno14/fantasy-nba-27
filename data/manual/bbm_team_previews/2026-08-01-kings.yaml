    model_mpg: 31.6
    bbm_mpg: ""                       # none stated
    budget_mpg: null
    model_usg: 23.7
    bbm_usg: "UP, unnumbered: 'now the ball can be a little bit more in his hands. He can use it more, he can pass a little bit more'"
    verdict: "none"
    proposal: false
    note: >
      Genuinely two-sided and it nets out. FOR: "he's still one of your top two best players"; the named
      usage mechanism is that Schroder, Westbrook and DeRozan "take the ball out of his hands, push him
      more to be just a spot-up three-point shooter", and all three are gone; Josh expects "a much bigger
      part or better part of the Kings". AGAINST, from the same episode: he is 31 on an expiring $49M, "not
      part of the future", the subject of live trade and buyout talk, and the team's posture toward his
      personal season is hostile — "the Kings don't care if he wants to have a career year... if you start
      to see that on the court, you're going to have that big old hook and just pull him right out of the
      game." No number in either direction, and the model already prices fpm 0.9335 vs 0.8960 actual.
  - player: Keegan Murray
