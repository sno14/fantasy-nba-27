    verdict: "none"
    proposal: false
    note: >
      Named as the player who changes the team's ceiling, and the history is a usage squeeze the
      organisation caused: "you're taking a player like Harrison Barnes who shot eight times a game and
      replacing him with a guy who shot 17 times a game... he goes in year two from 15 points down to 12 in
      year three. And that was because the Kings did that." Forward, though, the guest lands on LESS than
      you would expect: he would LIKE him to be the number two option but "I would expect him to be more of
      a number three option", and Josh's usage band (above ~15, below ~23-24) brackets the computed 18.7
      almost exactly — an assurance result, not a gap. Base is 23 gp (finger, then ankle) and the shooting
      is the open question: .277 from three, "the shooting has disappeared". The model already prices
      30.2 mpg off a 34.5-mpg small sample, i.e. it fades minutes and holds rate — the EXP-033 shape.
