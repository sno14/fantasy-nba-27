# SAC minutes+usage ledger — BBM team-preview snapshot (James Ham, Locked On Kings).
# DATED SNAPSHOT as of preview_date: model_* columns are the learned_2026-27 base then; not live.
# Schema + contract: ./README.md. Full sizing rules: ../bbm_transcripts/README.md (Team-preview mode).
#
# *** NO MINUTES FIGURE, NO USAGE FIGURE, NO ROTATION SIZE — and therefore no 240 allocation. ***
# This is the most ARGUABLE of the three step-1 failures in this batch, and the reasoning is written out
# so Steven can overrule it on one page.
#
# WHAT IT HAS. A starting five stated as firmly as ORL's — Acuff / LaVine / Hunter / Keegan Murray /
# Sabonis, with Josh saying "I honestly don't know that anybody could look at that and go, ah, that's
# definitely not happening" and the guest answering "I don't think so [there's any debate]". Named
# departures (Westbrook, Schroder, DeRozan, Devin Carter, Killian Hayes, Eubanks, McDermott) and arrivals.
# A named backup point guard ("he's the backup point guard at this point" — Monk).
#
# WHAT IT LACKS, which is what step 1 actually asks for:
#   * NO rotation size and NO bench order beyond Monk. The bench is discussed as a POOL of names with
#     unresolved standing (Clifford, Raynaud, Cardwell, Sharp, Plowden, Keon Ellis), and the guest's own
#     verdict on two of them is "whether either of those picks work out, to be honest with you, I'm not
#     sold yet. I still need to see more from both."
#   * The one forward-looking rotation claim is a CONDITIONAL with no counterparty named: "somewhere along
#     the way these guys are going to lose some minutes to a guy like Emanuel Sharp, to a guy like Nique
#     Clifford, even Daeqwon Plowden" — because the starting backcourt cannot defend. Which guys, how many
#     minutes, to whom in what proportion: none of it is stated.
#   * ROSTER NOT FINAL, and by the team's own admission: only 13 players under contract, "they have to do
#     at least one thing, one guy has to come in", plus live Sabonis trade talk (Toronto, contingent on
#     Kawhi Leonard) and LaVine trade-or-buyout talk. LaVine at 31.6 model mpg is explicitly "not part of
#     the future" and on an expiring $49M.
# Allocating 240 over that would be inventing a bench the beat writer declined to name. bbm_mpg and
# budget_mpg are both blank throughout and this ledger produces ZERO proposals.
#
# THE STRONGEST COUNTERARGUMENT, stated fairly: SAC's model board carries 315.2 mpg across 15 rows, the
# starting five is firmer than DAL's or DEN's, and there are obvious over-projections in the tail
# (Isaiah Stevens 17.3 mpg off a 3-game sample; DaQuan Jeffries 15.5 off 3 games; Dario Saric 12.1 off 5).
# If Steven wants those cut, they can be cut on model-internal grounds at the October pass without
# needing this preview at all — which is the cleaner route, since the preview never mentions any of them.
team: SAC
team_full: Sacramento Kings
preview_date: 2026-08-01
source_file: 2026-08-01-kings-season-preview.md
win_proj: 26            # up from 22; Vegas ~21.5-22.5. "I don't think that they can push for like 35."
availability_note: >
  No rest or tanking signal — the reverse, and it is unusually explicit. The new draft-lottery relegation
  zone gives Sacramento a direct incentive NOT to bottom out: "the last thing the Kings need to do is be
  the worst team in basketball and fall to the number 12 pick... I think that they're going to at least
  try to win games", and "losing doesn't help this season". Zack LaVine is kept partly for this reason:
  "Zack LaVine might help you be one of those better teams."
  The one quantified availability item is a POSITIVE and is a config/overrides.yaml consideration for
  Steven rather than an analyst-layer one: "the four players we talked about that are going to start
  alongside Darius Acuff, they missed like 194 combined games. You're getting those back." Our gp bases
  for those four (LaVine 59, Keegan Murray 60, Sabonis 61, Hunter 61) already assume large recoveries off
  39 / 23 / 19 / 45 actual games, so the model may well have this priced; flagged, not acted on.
budget_min: 240
rows:
  # ---- projected starting five: Acuff / LaVine / Hunter / Keegan Murray / Sabonis ("no debate") ----
  - player: Domantas Sabonis
    model_mpg: 30.0
    bbm_mpg: ""                       # none stated
    budget_mpg: null                  # no allocation — see header
    model_usg: 23.1                   # 19-gp season; 22-23 range is stable across his SAC years
    bbm_usg: "wants it UP ('run the ball through him') but explicitly refuses to predict it"
    verdict: "none"
    proposal: false
    note: >
      The single most tempting entry in this ledger, and the guest disarms it himself. The mechanism is
      real and well-argued — "the first part of the downfall of the Kings last season was going away from
      Sabonis when he was healthy"; "Sabonis is such a good passer that when you do that, then everybody is
      actually involved" — and the three ball-dominant guards who displaced him (Westbrook, Schroder,
      DeRozan) are all gone. But he then declines to predict it twice: "I don't know if they're going to be
      able to do that again", and "will Mike Miller, who's running the offense, run the ball through him? I
      don't know the answer to that because I kept waiting for it last year and it never happened even when
      he was healthy." A mechanism the source explicitly will not forecast is conviction, not a component.
      Base audit: 19 gp (hamstring, then cracked ribs/cartilage, then knee) — well under the ~25 flag.
      rate_held = 1.1746 / 1.2490 is not the right comparison here since the model's 1.2490 IS the
      projection; against his own 2024-25 rate the small sample fell, so per EXP-033 the model's handling
      is the conservative-correct one and there is no upward delta to write without a named minutes
      mechanism. Model already restores 29.7 -> 30.0 mpg and lifts fpm 1.1746 -> 1.2490.
