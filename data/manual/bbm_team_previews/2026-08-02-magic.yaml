  - player: Goga Bitadze
    model_mpg: 21.6
    bbm_mpg: ""                       # none stated
    budget_mpg: 8.0
    model_usg: 13.5
    bbm_usg: ""
    verdict: "-16.73"
    proposal: true
    note: >
      The largest delta in the batch, and the direct arithmetic consequence of the Vucevic signing. Both of
