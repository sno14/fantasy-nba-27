      Goga Bitadze because they needed the offense", and he only started "when Wendell Carter got hurt".
      With Carter stated at ~25 and Vucevic stated at 15-20, the 48 center minutes are spoken for and he is
      third in line. Yet the model projects him UP, 15.2 -> 21.6 mpg. Budget 8.0 rather than ~5 because a
      third center on a team with Carter's and Vucevic's injury histories has a real path to minutes; that
      hedge is priced once, inside the number. SIZE ACKNOWLEDGED: -16.75 fpts/g is large because his
      per-minute rate is genuinely high (1.2315) and the minutes cut is severe — one component, no stacking.
