# ORL minutes+usage ledger — BBM team-preview snapshot (Philip Rossman-Reich, Locked On Magic).
# DATED SNAPSHOT as of preview_date: model_* columns are the learned_2026-27 base then; not live.
# Schema + contract: ./README.md. Full sizing rules: ../bbm_transcripts/README.md (Team-preview mode).
#
# *** THE CLEANEST PREVIEW OF THE SEVEN SO FAR, AND IT CARRIES THE BATCH'S BIGGEST FINDING. ***
# Two stated minutes figures, both at the center position, and between them they close the position:
#   Vucevic  "I suspect Nikola Vucevic will be the backup center and he'll get 15 to 20 minutes a game...
#            But I don't see him pushing for starters minutes."
#   Carter   "Wendell Carter played only like 24, 25, 26 minutes a game... Carter is not a 35-minute-a-
#            night guy. He's going to play below 30 minutes most likely and Vucevic gets the others."
# Our board has VUCEVIC AT 28.5 mpg AND RANK 33 — pricing him as the starting center he was in Chicago
# and Boston, on a team that just signed him to back up Wendell Carter Jr. That is a ~10 mpg gap on a
# top-40 player, by far the most consequential single row in any ledger to date, and it is testimony
# rather than our arithmetic. Carter's own number (25.1) is confirmed almost exactly by the same passage.
#
# WHY THIS PREVIEW PASSES STEP 1 OF THE 2026-07-27 AMENDMENT WHEN DEN AND SAC DO NOT (same batch):
#   * Starting five stated and emphatic, from both sides. Josh: "there's no real debate to me with this."
#     Guest: "I think that's the starting five" — Suggs / Bane / Franz Wagner / Banchero / Carter — and it
#     is framed as a deliberate front-office statement: "the Magic sticking with the same starting lineup
#     is a show of faith... but it's also an ultimatum."
#   * Bench order named at the top: Anthony Black is "your sixth man... the main creator of their bench
#     groups"; Vucevic is the backup five with a figure attached.
#   * Roster is STABLE and final in a way none of the other six were: Vucevic in, Moritz Wagner and Jett
#     Howard out, one second-round rookie. No unsigned starter, no expected trade of a rotation player.
#   * Reserves-ready read present (Black's leap quantified, Bitadze's usage history given).
# The one genuine caveat, recorded rather than ignored: a NEW HEAD COACH. Jamal Mosley fired, Sean Sweeney
# hired, and the guest says plainly "we don't know what Sean Sweeney wants this team to do or how he's
# going to deploy all these pieces. We have assumptions and we think we know." Every budget_mpg below is
# therefore softer than it looks, and the mid-Oct pass should re-open them.
team: ORL
team_full: Orlando Magic
preview_date: 2026-08-02
source_file: 2026-08-02-magic-season-preview.md
win_proj: 47            # "47 or 48 wins right now... I think they get to the six seed"; 45 last season
                        # despite heavy injuries. Not an environmental cut like BOS — a genuine step up,
                        # which supports minute STABILITY (fewer blowout benchings), not a delta.
availability_note: >
  No team-level rest or tanking signal — the opposite: this is a team under financial pressure to win now
  ($2.5M under the second apron, "if they're in the play-in tournament again and they lose a first round
  playoff series... they can't sustain the team at this price"). What the episode DOES carry is one
  substantial player-level availability claim and a general one:
  (1) JALEN SUGGS — "you just kind of have to plan for him to miss 20 games. And that's a lot to plan to
  miss for someone who's really important." He played 57 games last season, which the guest calls "the
  second most he's played in his career" AND still "an injury-filled season". Our model has him at a gp
  base of 68, which looks materially too high. config/overrides.yaml candidate for Steven — and note it
  is SEPARATE from his minutes row below, which is a per-game-played claim.
  (2) A general durability read the model may already handle: Bane played all 82 ("by far the most games
  he's ever played... he tends to miss time"), Carter has now played 72+ twice running, Banchero "probably
  good for 70 games", Franz "two really injury-riddled seasons" but random rather than chronic.
  The guest also floats an Alex-Caruso-style minutes cap for Suggs and then explicitly withdraws it —
  "I'm not saying that they're going to do that with Suggs now" — so it is NOT priced below.
budget_min: 240
rows:
  # ---- projected starting five: Suggs / Bane / Franz Wagner / Banchero / Carter ("no real debate") ----
  - player: Paolo Banchero
    model_mpg: 34.2
    bbm_mpg: ""                       # none stated
    budget_mpg: 33.5
    model_usg: 27.6                   # down hard from 33.6 in 2024-25 — BBM's claim verified
    bbm_usg: "explicitly DOWN and framed as a good thing: 'he took five fewer shots per 75 possessions... he took his usage all the way down. His assist rate I think was his career high'"
    verdict: "none"
    proposal: false
    note: >
      A long chapter that prices to nothing, and the usage check is why. BBM's central factual claim —
      that Banchero's usage came down sharply while his assist rate hit a career high — is CONFIRMED by
      our cache (33.6 -> 27.6 USG%), and it is already inside the 2025-26 base the model projects from.
      What he wants next is finishing ("he's only like 50th percentile. He needs to push that two-three
      percentage points higher"), which is a hope with a number attached to the wrong thing — a percentile,
      not a mechanically reversible rate on a known volume. The rest is leadership and tempo criticism
      ("you got to move it. Too slow"), explicitly NOT about production: "his scoring numbers were
      virtually the same as the all-star year". Budget 33.5 vs 34.2 is inside the floor. The model already
      prices fpm 1.1807 against last season's 1.0897 — a +3.1 fpts/g rate recovery toward his 2024-25
      form — so the optimistic case is priced too.
  - player: Desmond Bane
    model_mpg: 32.4
    bbm_mpg: ""                       # none stated
    budget_mpg: 32.0
    model_usg: 23.3
    bbm_usg: ""                       # none stated
    verdict: "none"
    proposal: false
    note: >
      "Desmond Bane was my MVP this season last year." Locked-in starter, no minutes number, and the one
      specific mechanism is a shooting split that resolves to roughly where the model already sits: "he had
      the really bad start to the season. He shot 41% from three after December 1st... he was shooting like
      he did in Memphis." The model prices fpm 1.1679 against last season's 1.0599 — i.e. it has ALREADY
      taken +3.5 fpts/g of exactly that normalisation, back toward his 2024-25 rate of 1.2189. Adding the
      hot-half story on top would be textbook double-counting. Budget 32.0 vs 32.4, inside the floor.
  - player: Franz Wagner
    model_mpg: 31.8
    bbm_mpg: ""                       # none stated
    budget_mpg: 31.5
    model_usg: 27.0                   # 34-gp season; 31.0 in 2024-25
    bbm_usg: "soft DOWN, no number: 'you really have to force Franz to be the guy. Franz doesn't want to be the guy. He wants to defer'"
    verdict: "none"
    proposal: false
    note: >
      Base season is 34 gp — under the ~25 flag's spirit, so audited: rate_held = 1.1305 / 1.2079 (2024-25)
      = 0.936, comfortably below 1.0, which per EXP-033 means the rate genuinely fell and re-anchoring on
      the healthy season is exactly the error that backtested to +3.34 fpts/g. The model nonetheless
      projects fpm 1.2088 — slightly ABOVE his last healthy rate — while fading minutes 33.7 -> 31.8. That
      is the "fade lives in minutes" pattern EXP-033 describes, working correctly. BBM's content is injury
      framing ("these kind of random injuries") plus a deference note that cuts DOWN on usage, not up.
      Budget 31.5 vs 31.8, inside the floor.
  - player: Jalen Suggs
    model_mpg: 31.7
    bbm_mpg: ""                       # none stated forward — the Caruso 22-minute plan is explicitly withdrawn
    budget_mpg: 30.0
    model_usg: 22.9
    bbm_usg: ""                       # none stated
    verdict: "-2.07"
    proposal: true
    note: >
      The one budget-derived entry in this ledger that touches a top-25 player, and it is deliberately
      MODEST. The case is simply that the model has him at 31.7 mpg when he played 27.6 last season and
      28.6 the season before — it is projecting a +4.1 mpg rise for a player the preview describes as
      someone you "plan to miss 20 games" and floats capping. Budget 30.0 is still ABOVE both of his last
      two seasons; I have not priced the Caruso plan, because the guest raised it and then withdrew it
      ("I'm not saying that they're going to do that with Suggs now"), and a withdrawn hypothetical is not
      testimony. Availability is handled separately and is NOT double-counted here — see availability_note.
  - player: Wendell Carter Jr.
    model_mpg: 25.1
    bbm_mpg: "~25 ('played only like 24, 25, 26 minutes a game'; 'going to play below 30 minutes most likely')"
    budget_mpg: 25.0
    model_usg: 15.6
    bbm_usg: "explicitly low by design — 'for a fifth starter, low usage center, he does everything they need him to do defensively'"
    verdict: "none"
    proposal: false
    note: >
      STATED, and it CONFIRMS the model to within 0.1 mpg — the single best verification in this batch and
      the reason the Vucevic row below can be trusted. It is also the check working in the negative
      direction: the same passage that produces a -12 fpts entry on Vucevic produces nothing at all here.
      The model has already faded him 29.3 -> 25.1, which is the direction BBM describes. No rate leg: "he's
      not helping anybody's fantasy team out" and "he's got to be a more reliable shooter" are the two
      remarks, one a fantasy verdict and the other a wish.
