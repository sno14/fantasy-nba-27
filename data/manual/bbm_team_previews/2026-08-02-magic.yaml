    verdict: "-3.66"
    proposal: true
    note: >
      NOT MENTIONED IN THE PREVIEW AT ALL — stated plainly because it is the weakest entry here and Steven
      should weigh it as such. The case is arithmetic, not testimony: he played 24.7 mpg on a team that
      missed Franz for ~47 games, Suggs for 25 and Banchero for 10, and the model projects him UP from
      that to 25.6. With the stated starting five healthy and Black locked in as the sixth man, the backup
      forward minutes have to compress. Budget 21.0 is a moderate cut rather than a severe one precisely
      because the preview is silent on him.
  - player: Nikola Vučević
    model_mpg: 28.5
    bbm_mpg: "15-20 ('he'll get 15 to 20 minutes a game'; 'I don't see him pushing for starters minutes')"
    budget_mpg: 18.0
    model_usg: 22.1
    bbm_usg: ""                       # none stated; bench-scoring role, "12-14 points per game out of him"
    verdict: "-11.97"
    proposal: true
    note: >
      *** THE ROW OF THE BATCH. *** Rank 33 on our board at 28.5 mpg, and the beat writer says backup
      center, 15-20 minutes. The model is not wrong about the player — it is carrying forward the STARTING
      role he had elsewhere last season (28.4 mpg) into a team that signed him to sit behind a named,
      confirmed starter. This is exactly the depth-chart redistribution the model cannot derive from box
      scores. Taken at 18.0, the TOP of his stated range, because the same passage hedges upward: "there'll
      definitely be nights where Vucevic plays more because Carter's in foul trouble or Carter's hurt", and
      the board's mpg is conditional on games played. Rate held — "coming off the bench, you can get 12-14
      points per game out of him" is consistent with, not above, his own per-minute rate.
  - player: Jase Richardson
    model_mpg: 20.9
    bbm_mpg: ""                       # none stated — not mentioned
    budget_mpg: 11.0
    model_usg: 16.8
    bbm_usg: ""
    verdict: "-7.85"
    proposal: true
    note: >
      Not mentioned in the preview. The model projects him from 10.9 actual mpg to 20.9 — nearly doubling
