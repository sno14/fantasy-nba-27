# DAL minutes+usage ledger — BBM team-preview snapshot (Nick Angstadt, Locked On Mavs).
# DATED SNAPSHOT as of preview_date: model_* columns are the learned_2026-27 base then; not live.
# Schema + contract: ./README.md. Full sizing rules: ../bbm_transcripts/README.md (Team-preview mode).
#
# *** NO MINUTES FIGURES, NO USAGE FIGURES, AND — DELIBERATELY — NO 240 ALLOCATION EITHER. ***
# This is the first preview to FAIL step 1 of the 2026-07-27 budget-derivation amendment, and the failure
# is the rule working, not a gap in the pass. The amendment permits us to allocate the closed 240 only
# when the preview "states a depth chart": a named starting five, a stated rotation depth, named
# departures/arrivals, AND a read on which reserves are and are not ready. DAL gives us the first and
# third and explicitly REFUSES the other two:
#
#   * Rotation depth — the opposite of stated. "No coach plays 12 players, let alone like 15. Like,
#     there's no way that all these guys get minutes... I'm fascinated to see how this plays out."
#     No rotation size, no bench order, no minute split anywhere in 37 minutes of tape.
#   * Reserves-ready — this is the episode's OPEN QUESTION, not its answer. The "who's under pressure"
#     segment IS "who's going to stand out in Dusty May's system?", and de Larrea "could come over and
#     not be super ready right away".
#   * The roster is not even final: 16 under contract with cuts required, Gafford "I would guess not" on
#     the opening-night roster, Klay in the same sentence, and "the Mavs have some one more move in them
#     somewhere". Allocating 240 across a roster that is going to change is arithmetic pretending to be
#     a belief.
#   * Josh says it outright: "all that will be covered when we do the Dallas Mavericks again in September
#     when everything is settled and finalized."
#
# So every bbm_mpg AND every budget_mpg cell here is blank, and this ledger produces ZERO proposals. The
# contract's instruction for this case is explicit: "Without those, there is nothing to allocate from;
# fall back to `none` and wait. A vague 'they're deep' is not a depth chart." The September DAL episode
# is the re-open, and it is on the calendar by name.
#
# THIS IS NOT THE OKC SITUATION. The 2026-07-27 amendment exists because OKC handed over a stated depth
# chart and our OLD rule still returned zero movers off a roster that had shed 64.1 mpg. DAL is the
# genuinely different case the amendment's step 1 was written to separate out: the beat writer declined
# to name a rotation because the front office has not chosen one yet. The signal is real and it is that
# the minutes are UNKNOWN — which is a reason to wait, not a licence to invent twelve numbers.
#
# WHAT THE MODEL LOOKS LIKE ANYWAY (recorded so September has a baseline to argue with, NOT sized here):
# the 12 named rotation rows below carry 299.6 model mpg (ex-Kyrie) against a 240 budget — 379.5 once the
# 5 deep-bench rows are added, 412.9 with Kyrie — and the guest's projected
# day-one starting center is a rookie with no learned base at all. The overhang is large. It is also
# unallocatable today.
team: DAL
team_full: Dallas Mavericks
preview_date: 2026-07-28
source_file: 2026-07-28-mavericks-season-preview.md
win_proj: 41            # up from 26, but the guest immediately deflates the jump: under the new
                        # lottery-reform baseline "a 26 win team's probably a 32-win team", so the real
                        # improvement claimed is ~9 wins, and it is conditioned on "assuming a healthy
                        # Kyrie Irving, a NOT healthy Dereck Lively and second year Cooper Flagg".
availability_note: >
  No team-level tanking or rest signal — the opposite, if anything: the guest notes "the Mavericks to
  their credit did not intend to lose a lot of those games last year". What this episode carries instead
  is the largest PLAYER-level availability content of any preview so far, and TWO items have enough
  substance to be config/overrides.yaml candidates for Steven rather than mere watch flags:
  (1) DERECK LIVELY II — the strongest availability signal in any transcript to date. BOTH hosts
  independently land on "less than 10% chance he's ready opening night"; as of July 22 he "is not running
  or jumping or doing any of that stuff yet"; "it's a foot injury for a big, which is kind of a big deal"
  on top of a career of lower-body problems (55 gp -> fewer -> 7 gp). Model base is 22.9 mpg / 54 gp,
  which looks far too generous. NOTE: routing this to overrides.yaml is the COMPLETE answer, not a
  partial one — a confirmed out-timeline there also drives the EXP-030 nightly redistribution of his
  minutes to Gafford / Cisse / Morez Johnson, so writing analyst-layer deltas on those three would
  double-count the same fact.
  (2) KYRIE IRVING — "34 off an ACL"; "Kyrie is not going to play back to back especially early on", with
  the follow-on question "what do they do? Who do they position to that spot?" left open. Model base 54 gp.
  Neither is analyst-layer material under the standing hard rule.
budget_min: 240
