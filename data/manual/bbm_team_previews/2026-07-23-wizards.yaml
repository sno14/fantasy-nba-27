budget_note_repair_2026_07_27: >
  COVERAGE REPAIR (triggered by the OKC pass; user-approved scope). The original note below was sized
  against an undercounted denominator, and WAS is the worst case of it. Two corrections:
  .
  (1) SEVEN board-rostered players holding 119.0 model mpg were never rowed — the ledger covered the
  rotation BBM discussed and stopped. True WAS board total is 431.9 mpg across 19 players, not 312.9
  across 12. So the minutes that must evaporate are ~192, not the ~70 the original note computed.
  .
  (2) The declared `sum_bbm_mpg: 240` was NOT a sum. BBM's stated figures actually total 274 — he
  over-subscribes the 240 budget by ~34 before a single uncovered player is seated — and the original
  pass reconciled that by informally dropping Riley/Whitmore/Champagnie as "fringe/DNP-CD nights".
  Declaring a budget balanced is not the same as balancing it, and it is what let the seven omissions
  stay invisible. All seven repair rows are therefore allocated at or near zero.
  .
  NO APPROVED ENTRY IS RE-OPENED. The covered players' targets came from BBM's stated numbers, the
  highest-authority input we have; the defect was never that those targets were wrong, only that nobody
  was cut to pay for them. ONE new proposal falls out — Julian Reese (rank 171, 26.1 mpg, absent from a
  preview that names players 200 ranks below him). The other six are rank 312+ and stay note-only.
budget_note: >
  The starkest budget in the batch: the model hands out ~313 mpg to 12 holdovers because it prices each on
  their own TANK-TEAM history, blind to Trae + Davis + Dybantsa + Middleton arriving. A competitive 10-man
  rotation fits ~240, so ~70+ minutes must evaporate. They come off the young-wing/guard logjam — George is
  the winner (starter, +3.5); the four nameable losers are Coulibaly, Tre Johnson, Bub Carrington (on-ball
  role taken by Trae), and Will Riley (concentrated per user 2026-07-24: Carrington -4.5 / Coulibaly -4.0 take the brunt, Tre Johnson / Will Riley -2.0 each keep a niche). This is exactly the depth-chart redistribution the box-score model
  can't do (EXP-030 / role-change lever) — handed over by the beat analyst.
