# Analyst overrides (Step D2 / EXP-029) - the auditable human-judgment layer.
#
# DISCIPLINE (amended 2026-07-12, user decision - workflow v2, the LIVING layer):
#   * Entries may land any time information arrives (BBM-transcript triangulation via
#     config/analyst_proposals.yaml -> Steven approves -> copied here). The mid-Oct
#     analyst pass re-reviews every effective entry against fresh videos + the trigger
#     list before the dual freeze. Entries are NEVER fabricated - every one traces to an
#     approved proposal or the calendar pass, with its evidence in the rationale.
#   * Every reviewed player gets an entry, INCLUDING explicit `action: none` verdicts -
#     "reviewed, no change" (positive assurance) is information for the April table.
#   * Append-only. Never edit an entry after it is written: a change of mind is a NEW
#     entry for the same player with a later date (the latest-dated entry wins) - this
#     is how the layer stays current between now and October.
#   * Transcript-derived rationales start with "BBM <video-date>:" so April 2027 scores
#     that subset separately. Scoring CALIBRATES the layer (magnitudes, per-source
#     weighting) - per the 2026-07-12 user decision it is a standing supplement, not a
#     beat-the-model-or-die experiment. The dual freeze + scoring are unchanged.
#
# SCHEMA - a YAML list; each entry:
#   - name: "Player Name"          # matched via the shared normalizer + alias map;
#                                  #   an unmatched or ambiguous name fails loudly
#     date: 2026-10-05             # the day the verdict was written
#     category: role               # role | injury | hype | rookie | other
#     action: none                 # or: {fpts_delta: 2.0}  (adjust fpts/g; total
#                                  #   recomputed; ranking re-sorts as the byproduct)
#     # WORKFLOW POLICY (2026-07-12): fpts_delta or none ONLY. rank_delta exists in the
#     # arithmetic but our workflow never uses it - a rank shove past unrelated players
#     # is incoherent; change the per-game belief and let rank fall out.
#     rationale: >
#       One paragraph. Concrete evidence a feature can't hold (beat-writer reporting,
#       depth chart, coach statements, rehab timelines, BBM commentary + quote).
#
# Application: python scripts/apply_analyst.py <board.parquet>  ->  board B (preseason)
# and automatically every night in-season (update_daily.py; --no-analyst to disable).

