  status: proposed
  triangulation: "Model: rank 261, 21.8 mpg — already the pessimistic read. BBM: value
    band straddles our projection; short-term minutes possible while the rookie rehabs.
    Claude: none preseason; the real action is an overrides.yaml out-window for Konan
    Niederhauser + the EXP-030 redistribution once the season starts."
