# Proposed analyst overrides — Claude drafts, Steven approves (workflow v2, 2026-07-12).
#
# Each proposal uses the analyst_overrides.yaml entry schema PLUS three proposal-only
# fields: `status` (proposed | approved | rejected), `preview` (the board impact at a
# glance), and `triangulation` (model view · BBM basketball reasoning · Claude judgment).
#
# REVIEW: set each entry's `status` to approved or rejected, then:
#     python scripts/apply_proposals.py                 # see the fpts→rank impact
#     python scripts/apply_proposals.py --promote       # approved -> analyst_overrides.yaml
# Promotion is idempotent (skips entries already promoted) and strips the proposal-only
# fields. This file keeps the full history of what was proposed and why.
#
# TWO HARD RULES (user decisions 2026-07-12):
#   1. fpts_delta or none ONLY — never rank_delta. We change the belief about a player's
#      per-game value; the ranking re-sorts as a byproduct. Moving a player past unrelated
#      players by rank is incoherent.
#   2. BBM's ranking/tier claims ("top 50", "top 100") are IGNORED — he plays different
#      league settings. Only the basketball mechanism (role/minutes/usage/depth/injury)
#      transfers; Claude sizes the fpts_delta from that mechanism, not from his rank.
#
# SIZING (user decision 2026-07-13 — canonical rubric in data/manual/bbm_transcripts/
# README.md): size the TARGET level, not a bump — fpts_delta = triangulated ROS fpts/g
# minus the model's CURRENT base. So `none` = target ≈ base (not merely same direction);
# a magnitude gap under directional agreement is actionable both ways (the unpriced
# remainder). Multiple mechanisms on one player: re-triangulate the whole player from the
# current base into ONE superseding entry (the engine's latest-dated-wins dedupe means
# entries never sum) — judge what the combination means, never add deltas. NO hard caps
# (2026-07-13, superseding the same-day ±3/±5): the tiers mild ≈1 / moderate ≈2 /
# strong ≈3 are anchors, not limits — judgment dictates magnitude; unusually large
# deltas need unusually concrete, enumerated mechanisms. April 2027 calibrates.
#
# MINUTES & USAGE RULE (user decision 2026-07-17 — the Trae Young miss): BBM's stated
# minutes AND usage numbers get priority weight. Write his claim vs the base into every
# triangulation — minutes vs the model's mpg; usage vs last-season USG% computed from the
# cache (formula in the transcripts README; verified vs his own citations). A ~2+ mpg or
# ~2+ usage-point gap is presumptively actionable (either direction) unless a NAMED
# mechanism offsets it; usage sizes at ~0.5-0.8 fpts/g per point at starter minutes.
# Audit the base's gp first — a sub-~25-game base season is a small-sample artifact
# (Kessler, Trae); re-anchor on the last healthy season.

