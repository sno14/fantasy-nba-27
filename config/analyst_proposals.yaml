# Proposed analyst overrides — Claude drafts, Steven approves (workflow v2, 2026-07-12).
#
# Each proposal uses the analyst_overrides.yaml entry schema PLUS two proposal-only
# fields: `status` (proposed | approved | rejected) and `triangulation` (the three-angle
# reasoning: model view · BBM view · Claude's judgment). On approval, the entry is copied
# into config/analyst_overrides.yaml WITHOUT the two proposal fields (that file's loader
# validates strictly); this file keeps the full history of what was proposed and why.
#
# Example (delete when real proposals land):
#   - name: Example Player
#     date: 2026-07-15
#     category: role            # role | injury | hype | rookie | other
#     action: {rank_delta: -8}  # negative = up the board; or {fpts_delta: +2.0}; or none
#     rationale: "BBM 2026-07-10: 'locked in as the starter' — model sees only bench mins"
#     status: proposed
#     triangulation: "Model: rank 96, mpg 19 (no role signal). BBM: strong conviction,
#       names the mechanism (starter confirmed). Claude: mechanism is real and unpriced —
#       depth chart behind him is empty; moderate bump, not max (no preseason games yet)."

# ============ Batch 1 — BBM 2026-06-29 free-agency episode (proposed 2026-07-12) ============
# Source: data/manual/bbm_transcripts/2026-06-30-nba-roles.md; evidence ledger rows in
# data/manual/bbm_notes.csv. NOTE the episode predates free agency opening — it surveys
# uncertainty, so hedged claims land as `none` and movers are sized below their headline.
# Cam Boozer (rookie) is deliberately NOT here: he's market-seeded only, absent from the
# learned board, and an unmatched name fails loudly — his entry lands with the October sheet.

- name: Day'Ron Sharpe
  date: 2026-07-12
  category: role
  action: {fpts_delta: 3.0}
  rationale: "BBM 2026-06-29: 'per-minute monster... if we just give him 26 a night he's
    going to be a top 100 player' — Claxton is gone and Sharpe re-signed 2yr/$20M as the
    presumptive starter; hedged because 'I would doubt the Nets go into the year only
    having Sharpe and Wolf at center.'"
  status: proposed
  triangulation: "Model: rank 203, 20.3 mpg — the board cannot see the Claxton vacancy
    (prior-season role in, no roster news). BBM: concrete starter mechanism, top-100 claim
    at 26 mpg, explicitly hedged. Claude: the mechanism is real and unpriced; full credit
    (26 mpg) would be ~+6.5 fpts/g — proposing the rubric cap +3.0 (≈23 mpg equivalent),
    i.e. roughly half the starter scenario, weighted for the 'they'll add a body' hedge.
    His 9-cat-inflation warning doesn't bite: we score points."

- name: Ty Jerome
  date: 2026-07-12
  category: role
  action: {rank_delta: -10}
  rationale: "BBM 2026-06-29: with Ja gone, 'he's got to be the leader in that position,
    but it's also not remotely close to being a guarantee' — probable starting PG in a
    guard-poor Memphis."
  status: proposed
  triangulation: "Model: rank 152, 22.2 mpg — priced as a backup; the usage vacancy is
    invisible to it. BBM: moderate conviction, named mechanism (starter, thin depth chart:
    Pippen/Small/Clayton behind him). Claude: agree the vacancy is real and Jerome is the
    plurality favorite; moderate bump −10, not max — his own 'not remotely a guarantee'
    plus Boozer absorbing playmaking caps the upside."

- name: Brandon Miller
  date: 2026-07-12
  category: role
  action: {rank_delta: -8}
  rationale: "BBM 2026-06-29: 'can Miller become a 30 plus usage guy with five assists
    attempting six, seven free throws?' — LaMelo's 30+ usage vacated; Miller already at
    28% usage in 30 mpg; the year-3/4 star-leap markers he watches (FT rate, assist rate)."
  status: proposed
  triangulation: "Model: rank 81 — solid but blind to the usage vacancy. BBM: probable
    usage bump, though he notes the Hornets could still add a creator ('I think they
    actually do trust that combination'). Claude: mechanism concrete and partially
    unpriced (our mpg 31.9 already assumes a big role; the delta is usage, not minutes) —
    moderate-mild −8."

- name: Isaiah Stewart
  date: 2026-07-12
  category: role
  action: {rank_delta: -5}
  rationale: "BBM 2026-06-29: traded to Memphis, 'their perhaps starter if Edey's not
    healthy, and backup center'; near all-defensive-team quality."
  status: proposed
  triangulation: "Model: rank 213 — and it independently projects Edey fragile (43 gp,
    rank 350), which raises the value of being next man up. BBM: mild-moderate, health-
    conditional. Claude: mild −5; the two signals point the same way but the starter path
    is conditional."

- name: Ryan Rollins
  date: 2026-07-12
  category: role
  action: none
  rationale: "BBM 2026-06-29: 'excellent player... top 50 without Giannis most of the
    season' — but he flags real trade-asset risk ('might net them one to two firsts') and
    a crowded creation room (Herro in, Porter back)."
  status: proposed
  triangulation: "Model: rank 64 — already prices most of the top-50-without-Giannis
    world. BBM: praise + instability in the same breath. Claude: agreement = assurance;
    no new unpriced mechanism, real downside scenario → none (recorded confidence, no move)."

- name: Tyler Herro
  date: 2026-07-12
  category: role
  action: none
  rationale: "BBM 2026-06-29: 'Herro will take on some of this creation role. But does he
    even stay on the team?' — traded into the Giannis-sized usage hole, flagged as a
    possible re-trade piece."
  status: proposed
  triangulation: "Model: rank 39. BBM: role up, stability down — the two cancel. Claude:
