# ============ Batch 12 — BOS team preview (2026-07-31) + DAL team preview (2026-07-28) ============
# Sources: 2026-07-31-celtics-season-preview.md (John Karalis, Locked On Celtics)
#          2026-07-28-mavericks-season-preview.md (Nick Angstadt, Locked On Mavs)
# Ledgers: data/manual/bbm_team_previews/2026-07-31-celtics.yaml  (17 rows; budget sums to exactly 240)
#          data/manual/bbm_team_previews/2026-07-28-mavericks.yaml (21 rows; budget DELIBERATELY unallocated)
# Notes: 32 rows appended to data/manual/bbm_notes.csv (15 BOS, 17 DAL).
# Step 0 transactions refresh RAN before sizing: cache 2026-07-23 -> 2026-07-25 (11 rows). It mattered —
# Risacher and Aldama are correctly on DAL, and all four BOS signings (Robinson, Conley, Bassey, Amari
# Williams) resolve. 2026-07-25 is the newest date the source has posted, so nothing is missing.
#
# TWO PREVIEWS, TWO DIFFERENT VERDICTS ON THE SAME QUESTION — and that is the point of this batch.
# The 2026-07-27 amendment lets the closed 240 budget supply a minutes number when a preview states a
# depth chart but no figures. Its step 1 is a GATE, not a formality, and these two episodes land on
# opposite sides of it:
#
#   BOS PASSES. Named starting five (White/Tatum/George/Hauser/Robinson), a named bench order (Pritchard
#   the six-man ball-handler, Scheierman and Gonzalez the secondary handlers, Conley explicitly NOT
#   trusted with the ball, Garza "still going to be your third string center"), named departures/arrivals,
#   and a reserves-ready read. PLUS the only stated minutes figure in either episode: the center split,
#   "mid 20 minutes for one guy, mid 20 minutes for the other guy" against Josh's "24 minutes a piece".
#   -> 7 entries below.
#
#   DAL FAILS, and I have written ZERO proposals for it. The contract's words for this case are exact:
#   "Without those, there is nothing to allocate from; fall back to `none` and wait." Rotation depth is
#   not merely unstated, it is disclaimed — "no coach plays 12 players, let alone like 15. There's no way
#   that all these guys get minutes... I'm fascinated to see how this plays out." Which reserves are ready
#   is the episode's open QUESTION (the whole "who's under pressure" segment). And the roster is not final:
#   16 under contract with cuts required, Gafford "I would guess not" on the opening-night roster, Klay in
#   the same breath, "the Mavs have one more move in them somewhere". Josh closes by saying the real pass
#   comes in September "when everything is settled and finalized".
#   Steven: this is NOT a repeat of the OKC zero-mover failure that produced the amendment. OKC handed
#   over a stated depth chart and our old rule still returned nothing. DAL is the case step 1 was written
#   to separate out — the beat writer declined to name a rotation because nobody has chosen one. If you
#   would rather I allocate 240 across DAL anyway, say so and I will; I judged that inventing twelve
#   numbers over a roster that is about to change is the unchecked-number failure the rule guards against.
#   The DAL ledger carries full coverage (21 rows) so nothing was silently skipped.
#
# SHAPE OF THE BOS BATCH: exactly what the contract predicts for preview mode — one stated-minutes
# positive, one rate entry at the top of the board, and four large cuts on a tail the model over-minutes.
# Jaylen Brown (~34 mpg) leaves while Tatum (16 gp last season) and Paul George arrive into the SAME 240,
# so ~28 mpg must come out of the bench. The model moves it the WRONG WAY — Scheierman 18.6 -> 21.7,
# Gonzalez 14.6 -> 18.1, Walsh 17.8 -> 18.9 — because it watched those three absorb a Tatum-less season
# and read it as growth. The 12 rotation rows sum to 280.6 model mpg against 240.
#
# THE THREE LOUDEST NARRATIVES IN THE BOS EPISODE ALL PRICE TO `none`, and the reasons differ:
#   * Payton Pritchard — a full chapter demolishing the "next Brunson" story, and the MODEL ALREADY
#     AGREES: it fades him 32.3 -> 28.1 mpg, which is almost exactly the 28.4 he played as a six-man in
