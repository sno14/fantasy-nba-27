    anything this entry is the audit trail that we chose NOT to stack."

- name: Paul Reed
  date: 2026-07-12
  category: role
  action: none
  rationale: "BBM 2026-06-29: 'per-minute beast... but there's no way Detroit goes into a
    season with Paul Reed as their only center' — the starter fantasy dies on the expected
    Sabonis/Duren/Robinson arrival."
  status: proposed
  triangulation: "Model: rank 190, 16.7 mpg — backup pricing. BBM: explicitly against the
