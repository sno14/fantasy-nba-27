# League configuration — the decision layer's input (implementation-plan Step D1,
# design-critique §9). Scoring weights stay in scoring.yaml; this file is the league's
# *structure*: it drives replacement-level (VOR), schedule/playoff-week values, streaming
# horizons, and the ROS cutoff.
#
# CONFIRMED (user, 2026-07-10): **ESPN default points league, 10 teams, weekly H2H
# matchups.** scoring.yaml already carries the ESPN default points weights, so every
# ledger verdict to date was computed under the real league scoring — nothing re-runs
# (D1.1's "verify before draft day" check: passed). ESPN-default details below that the
# user has not explicitly confirmed are marked "ESPN default" — revisit only if the
# league customizes.

name: my-league
platform: espn
teams: 10                 # confirmed 2026-07-10
format: h2h_points        # weekly H2H matchups, points scoring (confirmed 2026-07-10)
lineup_frequency: daily   # ESPN default: lineups set daily within the weekly matchup
                          # => weekly game counts drive matchups; streaming drives the
                          #    last roster spots — both D1 outputs matter.

# Roster slots (ESPN default: 13 players — drives replacement level per slot). Keys are
# platform slot names; positions map to allocation position groups until platform
# eligibility exists.
roster:
  PG: 1
  SG: 1
  SF: 1
  PF: 1
  C: 1
  G: 1
  F: 1
  UTIL: 3
  BENCH: 3
  IR: 1

games_cap_per_week: null      # ESPN points default: no weekly games cap

# League season ends BEFORE the NBA regular season (user direction 2026-07, exact gap
# still TBD — derive concrete weeks from ESPN's 2026-27 matchup calendar once published).
# Consequences (wired in Step D1 / Step 11): ROS projections and totals cut at
# league_end, not the NBA finale; fantasy playoff weeks are derived from the schedule
# minus this offset; the late-season rest/tank regime largely falls OUT of the
# decision horizon (it remains a training-label issue — EXP-012's concern — since
# historical data still contains those weeks).
league_end_offset_weeks: 3    # ~2-3 weeks before NBA regular-season end; not concrete
fantasy_playoff_weeks: [19, 20, 21]   # placeholder — derive from schedule + offset once set

waivers: priority             # ESPN default: rolling waiver priority (no FAAB unless customized)
faab_budget: null
keeper: false                 # dynasty/keeper valuation is out of scope while false
