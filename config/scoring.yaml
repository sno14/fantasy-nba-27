# League scoring definition.
#
# ESPN Fantasy Basketball DEFAULT points-league scoring.
# Source: https://www.espn.com/fantasy/basketball/story/_/id/30296896
# CONFIRMED as the real league's scoring (user, 2026-07-10: ESPN default points league) —
# the D1.1 pre-draft verification is done; every ledger verdict already ran under these
# weights. If the league ever customizes, only this file changes (projections are stat
# lines; scoring converts them).
#
# Stat keys use these canonical names (see fantasy_nba.scoring.STAT_KEYS):
#   pts   points                fgm  field goals made      fg3m  three-pointers made
#   reb   total rebounds        fga  field goals attempted
#   ast   assists               ftm  free throws made
#   stl   steals                fta  free throws attempted
#   blk   blocks
#   tov   turnovers

name: espn_points
description: ESPN Fantasy default points-league scoring

weights:
  pts: 1.0
  fg3m: 1.0
  fgm: 2.0
  fga: -1.0
  ftm: 1.0
  fta: -1.0
  reb: 1.0
  ast: 2.0
  stl: 4.0
  blk: 4.0
  tov: -2.0

# ESPN's default points league awards no double-double / triple-double bonus.
bonuses: {}
