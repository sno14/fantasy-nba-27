[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-nba"
version = "0.1.0"
description = "NBA fantasy basketball projections for the 2026-27 season"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "nba_api>=1.5.2",
    "PyYAML>=6.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
