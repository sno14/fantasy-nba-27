name: Deploy static board

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published board snapshot
        run: python -c "import json,pathlib; p=pathlib.Path('static/data/board.json'); d=json.loads(p.read_text(encoding='utf-8')); assert d.get('analyst_layer') is True; assert d.get('rows'); print('Publishing', len(d['rows']), 'Board-B rows from', d['generated_at'])"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - id: deployment
        uses: actions/deploy-pages@v4
